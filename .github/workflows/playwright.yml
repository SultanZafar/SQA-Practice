name: Playwright Automation Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright pytest-playwright flask requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ensure Playwright Browsers are Installed
        run: playwright install --with-deps

      # Database initialize karke Server ko background mein start karna
      - name: Start API Server & Wait for Health Check
        run: |
          python app.py > flask.log 2>&1 &
          
          # Health check endpoint (/api/health) ready hone ka wait karna
          echo "Waiting for Flask server to respond..."
          for i in {1..20}; do
            if curl -s http://127.0.0.1:5000/api/health | grep -q "ok"; then
              echo "Server is live and ready!"
              break
            fi
            echo "Waiting... ($i)"
            sleep 2
          done

      # Tests execute karna
      - name: Run All Automated Tests
        run: pytest

      # Fail hone par Server Logs dikhana
      - name: Print Server Error Logs if Failed
        if: failure()
        run: |
          echo "=== FLASK LOGS ==="
          cat flask.log