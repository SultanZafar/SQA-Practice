name: Playwright Automation Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright pytest-playwright flask
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ensure Playwright Browsers are Installed
        run: playwright install --with-deps

      # Flask app ko 0.0.0.0 par bind karke start karein
      - name: Start API Server
        run: |
          python -c "import app; app.init_db()" || true
          FLASK_APP=app.py flask run --host=0.0.0.0 --port=5000 > flask.log 2>&1 &
          sleep 5

      # Run Tests using 127.0.0.1
      - name: Run All Automated Tests
        run: pytest

      # Fail hone par Flask Output Dikhayein
      - name: Print Flask Logs if Failed
        if: failure()
        run: cat flask.log