name: Playwright Automation Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright pytest-playwright

      - name: Ensure Playwright Browsers are Installed
        run: playwright install --with-deps

      # Step 1: Backend API Server ko background mein run karein
      - name: Start API Server
        run: |
          python app.py &
          sleep 5

      # Step 2: Automation tests run karein
      - name: Run All Automated Tests
        run: pytest