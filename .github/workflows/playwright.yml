name: Playwright Automation Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright pytest-playwright flask
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ensure Playwright Browsers are Installed
        run: playwright install --with-deps

      # Database initialize karein aur Flask ko 127.0.0.1 + 0.0.0.0 dono par bind karein
      - name: Start API Server
        run: |
          python -c "import app; app.init_db()" || true
          python app.py > flask.log 2>&1 &
          sleep 5

      # Run Tests
      - name: Run All Automated Tests
        run: pytest

      # Debug Logs
      - name: Print Flask Logs if Failed
        if: failure()
        run: cat flask.log