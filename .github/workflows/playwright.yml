name: Playwright Automation Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright pytest-playwright flask requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ensure Playwright Browsers are Installed
        run: playwright install --with-deps

      # Flask App start + Direct Pytest Run
      - name: Run App & Tests
        run: |
          python app.py &
          npx wait-on http://127.0.0.1:5000/api/health --timeout 15000
          pytest