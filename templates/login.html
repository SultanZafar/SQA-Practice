{% extends "base.html" %}
{% block title %}Login - TaskFlow{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Login to TaskFlow</h2>
    <form method="POST" id="login-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" id="login-submit" class="btn btn-primary">Login</button>
    </form>
    <p class="form-footer">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
</div>
{% endblock %}
