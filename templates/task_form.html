{% extends "base.html" %}
{% block title %}{% if task %}Edit Task{% else %}New Task{% endif %} - TaskFlow{% endblock %}
{% block content %}
<div class="form-card">
    <h2>{% if task %}Edit Task{% else %}Create New Task{% endif %}</h2>
    <form method="POST" id="task-form">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Task title" maxlength="100"
                   value="{{ task.title if task else '' }}" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Task description (optional)" rows="4">{{ task.description if task else '' }}</textarea>
        </div>
        <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
                <option value="Low" {% if task and task.priority == 'Low' %}selected{% endif %}>Low</option>
                <option value="Medium" {% if not task or task.priority == 'Medium' %}selected{% endif %}>Medium</option>
                <option value="High" {% if task and task.priority == 'High' %}selected{% endif %}>High</option>
            </select>
        </div>
        {% if task %}
        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
                <option value="Pending" {% if task.status == 'Pending' %}selected{% endif %}>Pending</option>
                <option value="In Progress" {% if task.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                <option value="Completed" {% if task.status == 'Completed' %}selected{% endif %}>Completed</option>
            </select>
        </div>
        {% endif %}
        <button type="submit" id="task-submit" class="btn btn-primary">{% if task %}Update Task{% else %}Create Task{% endif %}</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
